<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OpenTRMS Reel</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-400.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-500.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-600.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-700.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/inter-800.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(fonts/jbm-400.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(fonts/jbm-500.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(fonts/jbm-700.woff2)}
html,body{margin:0;background:#000;overflow:hidden;height:100%}
canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;margin:auto}
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
/* ============================================================
   OpenTRMS — 15s motion reel. 120 BPM, 60 fps, 1920x1080.
   Every frame is a pure function of t → sub-frame motion blur.
   ============================================================ */
const W=1920,H=1080,DUR=15,FPS=60;
const out=document.getElementById('out'),octx=out.getContext('2d');
const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
const small=document.createElement('canvas');small.width=480;small.height=270;const sctx=small.getContext('2d');
const wm=document.createElement('canvas');wm.width=W;wm.height=H;const wctx=wm.getContext('2d');

const C={bg:'#090d13',panel:'#141a23',panel2:'#1c232e',line:'#34404f',teal:'#14b8a6',tealL:'#5eead4',tealD:'#0c8a7f',
  white:'#f8fafc',fg2:'#cdd4de',muted:'#8b95a3',red:'#ef4444',amber:'#f59e0b',green:'#10b981'};
const TEAL=a=>`rgba(20,184,166,${a})`;

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  oC:x=>1-(1-x)**3, iC:x=>x**3, ioC:x=>x<.5?4*x**3:1-(-2*x+2)**3/2,
  oQ:x=>1-(1-x)**4, oX:x=>x>=1?1:1-2**(-10*x), iX:x=>x<=0?0:2**(10*x-10),
  ioX:x=>x<=0?0:x>=1?1:x<.5?2**(20*x-10)/2:(2-2**(-20*x+10))/2,
  oB:x=>{const c1=1.9,c3=c1+1;return 1+c3*(x-1)**3+c1*(x-1)**2}, ioS:x=>-(Math.cos(Math.PI*x)-1)/2};
const spring=(dt,w=14,z=7)=>dt<=0?0:1-Math.exp(-z*dt)*Math.cos(w*dt);
function hash(n){n=Math.imul((n|0)^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);n^=n>>>16;return(n>>>0)/4294967296}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const beatPulse=(t,k=9)=>t<0.5?0:Math.exp(-k*(t%0.5));

/* ---------- text ---------- */
const F=(w,s,m)=>`${w} ${s}px ${m?'"JetBrains Mono"':'Inter'}`;
function T(s,x,y,o={}){ctx.save();ctx.font=o.f||F(600,32);ctx.textAlign=o.al||'left';ctx.textBaseline=o.bl||'alphabetic';
  ctx.letterSpacing=(o.ls||0)+'px';if(o.a!=null)ctx.globalAlpha*=o.a;
  if(o.stroke){ctx.strokeStyle=o.c||C.white;ctx.lineWidth=o.stroke;ctx.strokeText(s,x,y)}else{ctx.fillStyle=o.c||C.white;ctx.fillText(s,x,y)}ctx.restore()}
function M(s,f,ls=0){ctx.save();ctx.font=f;ctx.letterSpacing=ls+'px';const m=ctx.measureText(s);ctx.restore();return m}
function rgbOf(c){if(c[0]==='#'){const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255]}return[255,255,255]}
function splitT(s,x,y,o,amt){if(amt<0.5){T(s,x,y,o);return}const[r,g,b]=rgbOf(o.c||C.white);
  ctx.save();ctx.globalCompositeOperation='lighter';
  T(s,x-amt,y,{...o,c:`rgb(${r},0,0)`});T(s,x,y+amt*.25,{...o,c:`rgb(0,${g},0)`});T(s,x+amt,y,{...o,c:`rgb(0,0,${b})`});ctx.restore()}
// masked line reveal: pin 0→1 rises in from below, pout 0→1 exits upward
function maskT(s,x,y,pin,pout=0,o={}){if(pin<=0||pout>=1)return;const m=M(s,o.f,o.ls);const w=m.width;
  const asc=m.fontBoundingBoxAscent,desc=m.fontBoundingBoxDescent,h=asc+desc;
  let lx=x;if(o.al==='center')lx=x-w/2;else if(o.al==='right')lx=x-w;
  ctx.save();ctx.beginPath();ctx.rect(lx-60,y-asc-2,w+120,h+4);ctx.clip();
  const dy=(1-pin)*h*1.02-pout*h*1.02;
  if(o.split)splitT(s,x,y+dy,o,o.split);else T(s,x,y+dy,o);ctx.restore()}
const GLY='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>';const HEX='0123456789abcdef';
function scr(s,t,t0,dur,set=GLY,seed=1){let o='';for(let i=0;i<s.length;i++){const ti=t0+dur*i/s.length;const ch=s[i];
  if(ch===' '||ch==='·'){o+=t>ti?ch:' ';continue}
  if(t>=ti+0.07)o+=ch;else if(t>=ti-0.1)o+=set[Math.floor(hash(i*131+Math.floor(t*40)*7+seed)*set.length)];else o+=' '}return o}

/* ---------- primitives ---------- */
function bg(c=C.bg){ctx.fillStyle=c;ctx.fillRect(-200,-200,W+400,H+400)}
function grid(ox,oy,a,step=48,col='#3f4856'){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();
  for(let x=((ox%step)+step)%step-step;x<W+step;x+=step){ctx.moveTo(x,-200);ctx.lineTo(x,H+200)}
  for(let y=((oy%step)+step)%step-step;y<H+step;y+=step){ctx.moveTo(-200,y);ctx.lineTo(W+200,y)}ctx.stroke();ctx.restore()}
function glow(x,y,r,col,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

/* ============ SCENE 1 — SIGNAL (0 → 2.0) ============ */
const PATH=(()=>{const r=rng(7),a=[];let y=0;for(let i=0;i<=800;i++){y+=(r()-0.535)*17;a.push(y+Math.sin(i*0.07)*24+Math.sin(i*0.021)*60)}return a})();
const pY=x=>{const i=clamp(x/10,0,799.999),i0=Math.floor(i);return lerp(PATH[i0],PATH[i0+1],i-i0)};
const pYs=x=>{let s=0;for(let k=0;k<14;k++)s+=pY(x-k*45);return s/14};
const headX=t=>{const d=Math.max(0,t-0.35);return 1450*d+1050*d*d};
const WORDS=[[0.5,'TRADE.'],[1.0,'EVENT.'],[1.5,'HASH.']];

function scene1(t){
  bg();
  const hx=headX(t),shx=lerp(960,1400,E.oC(P(t,0.35,1.2)));
  const camX=hx-shx,camY=pYs(hx);
  const Y=wy=>620+(wy-camY);
  const fade=E.oC(P(t,0,0.25));
  grid(-camX*0.3,-camY*0.3,0.16*E.oC(P(t,0.15,0.9))*(1+beatPulse(t)*0.8));
  glow(shx,Y(pY(hx)),900,TEAL(1),0.12*fade);
  // price axis
  if(t>0.3){const a=E.oC(P(t,0.3,0.8));ctx.save();ctx.setLineDash([4,8]);ctx.strokeStyle=`rgba(139,149,163,${0.18*a})`;ctx.lineWidth=1;
    const k0=Math.floor((camY-700)/70),k1=Math.ceil((camY+700)/70);
    for(let k=k0;k<=k1;k++){const y=Y(k*70);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W-150,y);ctx.stroke();
      T((1.0850-k*70*0.00004).toFixed(4),W-70,y+6,{f:F(500,17,1),c:C.muted,al:'right',a:0.6*a})}ctx.restore()}
  // kinetic words
  const eA=E.oX(P(t,0.44,0.66)),exitW=E.iC(P(t,1.82,1.98));
  maskT('EVERY',126,408,eA,exitW,{f:F(800,118),c:'#6b7684',stroke:2.5,ls:4,split:10*Math.exp(-14*Math.max(0,t-0.5))});
  WORDS.forEach(([ti,w],i)=>{if(t<ti-0.02)return;const nx=WORDS[i+1];
    const pin=E.oX(P(t,ti-0.02,ti+0.2)),pout=nx?E.iC(P(t,nx[0]-0.09,nx[0]-0.01)):exitW;
    maskT(w,112,650,pin,pout,{f:F(800,250),c:i===2?C.teal:C.white,ls:-8,split:26*Math.exp(-13*(t-ti))})});
  // the price line
  if(t>0.35){const x0=Math.max(0,camX-40);const pts=[];for(let x=x0;x<hx;x+=6)pts.push([x-camX,Y(pY(x))]);pts.push([shx,Y(pY(hx))]);
    wctx.setTransform(1,0,0,1,0,0);wctx.clearRect(0,0,W,H);wctx.beginPath();pts.forEach((p,i)=>i?wctx.lineTo(p[0],p[1]):wctx.moveTo(p[0],p[1]));wctx.lineTo(shx,H+50);wctx.lineTo(pts[0][0],H+50);wctx.closePath();
    const ag=wctx.createLinearGradient(0,Y(pY(hx))-200,0,H);ag.addColorStop(0,TEAL(0.3));ag.addColorStop(1,TEAL(0));wctx.fillStyle=ag;wctx.fill();
    wctx.globalCompositeOperation='destination-in';const hg=wctx.createLinearGradient(pts[0][0],0,shx,0);hg.addColorStop(0,'rgba(0,0,0,0)');hg.addColorStop(Math.min(0.6,Math.max(0.05,(shx-pts[0][0])>900?0.4:0.6)),'rgba(0,0,0,1)');hg.addColorStop(1,'rgba(0,0,0,1)');wctx.fillStyle=hg;wctx.fillRect(0,0,W,H);wctx.globalCompositeOperation='source-over';
    ctx.save();ctx.drawImage(wm,0,0);
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    const lg=ctx.createLinearGradient(shx-1400,0,shx,0);lg.addColorStop(0,TEAL(0.15));lg.addColorStop(1,C.tealL);
    ctx.strokeStyle=lg;ctx.lineWidth=5;ctx.lineJoin='round';ctx.shadowColor=C.teal;ctx.shadowBlur=24;ctx.stroke();ctx.restore()}
  // head
  const hy=Y(pY(hx)),r0=E.oB(P(t,0.04,0.32));
  if(r0>0){glow(shx,hy,260*r0*(1+beatPulse(t)*0.5),TEAL(1),0.55);
    const bp=beatPulse(t,6);ctx.save();ctx.strokeStyle=TEAL(0.7*bp);ctx.lineWidth=2;ctx.beginPath();ctx.arc(shx,hy,14+(1-bp)*70,0,7);ctx.stroke();ctx.restore();
    ctx.fillStyle=C.white;ctx.beginPath();ctx.arc(shx,hy,9*r0,0,7);ctx.fill()}
  // live tag
  const ta=E.oC(P(t,0.45,0.7));
  if(ta>0){ctx.save();ctx.globalAlpha=ta;ctx.setLineDash([3,6]);ctx.strokeStyle=TEAL(0.6);ctx.beginPath();ctx.moveTo(shx+16,hy);ctx.lineTo(W-160,hy);ctx.stroke();ctx.restore();
    const px=(1.0850-pY(hx)*0.00004).toFixed(4);ctx.save();ctx.globalAlpha=ta;rr(W-156,hy-19,110,38,5);ctx.fillStyle=C.teal;ctx.fill();ctx.restore();
    T(px,W-101,hy+7,{f:F(700,18,1),c:'#04110f',al:'center',a:ta});
    T('EUR/USD · LIVE',shx+26,hy-26,{f:F(600,16,1),c:C.tealL,ls:3,a:ta})}
  if(fade<1){ctx.fillStyle=`rgba(0,0,0,${1-fade})`;ctx.fillRect(-100,-100,W+200,H+200)}
}
function slabWipe(t,t0,dur){if(t<t0||t>t0+dur+0.08)return;
  for(let i=0;i<6;i++){const p=E.ioC(P(t,t0+i*0.007,t0+dur+i*0.007));if(p<=0||p>=1)continue;
    const xl=lerp(-3*W,W,p),y0=i*H/6-2,h=H/6+4,sk=120;
    ctx.fillStyle=i%2?C.tealD:C.teal;ctx.beginPath();ctx.moveTo(xl+sk,y0);ctx.lineTo(xl+3*W+sk,y0);ctx.lineTo(xl+3*W,y0+h);ctx.lineTo(xl,y0+h);ctx.closePath();ctx.fill();
    ctx.fillStyle=C.white;ctx.beginPath();ctx.moveTo(xl+3*W+sk,y0);ctx.lineTo(xl+3*W+sk+10,y0);ctx.lineTo(xl+3*W+10,y0+h);ctx.lineTo(xl+3*W,y0+h);ctx.fill()}}

/* ============ SCENE 2 — HASH CHAIN (2.0 → 4.5) ============ */
const EV=[['DealCaptured','a7f3c91d4b2e6a0f','0000000000000000'],['STPPassed','3d82b47e0c19f4a9','a7f3c91d4b2e6a0f'],
  ['DealConfirmed','9bc14a2f7e55d3e7','3d82b47e0c19f4a9'],['DealValuated','e5f0d839b61aa8c2','9bc14a2f7e55d3e7']];
const g4=s=>s.replace(/(.{4})(?=.)/g,'$1 ');
const CX0=55,CP=470,CW=400,CH=236,CY=560,TAM=[3.52,3.84];
const cardT=i=>2.12+i*0.13;
function scene2(t){
  bg();
  const k=E.ioS(P(t,2.0,4.2)),s=lerp(0.9,1.0,k),pan=lerp(30,-30,k);
  const FX=CX0+2*CP+CW+35,FY=CY+CH/2;
  const fsx=960+(FX-960+pan)*s,fsy=600+(FY-600)*s;
  const zp=P(t,4.2,4.5),z=Math.exp(Math.log(130)*E.iX(zp)),ze=E.ioC(zp);
  ctx.save();ctx.translate(lerp(fsx,960,ze),lerp(fsy,540,ze));ctx.scale(z,z);ctx.translate(-fsx,-fsy);
  grid(pan*0.6,-(t-2)*18,0.13*(1+beatPulse(t)*0.6));
  glow(960,660,1000,TEAL(1),0.10);
  ctx.save();ctx.translate(960,600);ctx.scale(s,s);ctx.translate(-960+pan,-600);
  // headline
  T(scr('SHA-256 · HASH-CHAINED EVENT STORE',t,2.04,0.3),110,196,{f:F(600,22,1),c:C.teal,ls:5});
  const hf=F(800,124);
  maskT('Tamper-evident',104,340,E.oX(P(t,2.08,2.4)),0,{f:hf,ls:-5});
  const tw=M('Tamper-evident ',hf,-5).width;
  maskT('by design.',104+tw,340,E.oX(P(t,2.2,2.52)),0,{f:hf,c:C.teal,ls:-5});
  maskT('Every mutation is an immutable, hash-linked event. Nothing is overwritten — ever.',110,418,E.oX(P(t,2.35,2.7)),0,{f:F(500,30),c:C.fg2});
  const tam=t>TAM[0]&&t<TAM[1];
  for(let i=0;i<3;i++)link(i,t,tam&&(i===1||i===2));
  for(let i=0;i<4;i++)card(i,t,tam&&i===2);
  if(tam){const a=1;T('⚠ TAMPER DETECTED — HASH MISMATCH',CX0+2*CP+CW/2,CY-26,{f:F(700,20,1),c:C.red,al:'center',ls:2,a})}
  // verified stamp
  const sp=P(t,3.88,4.1);if(sp>0){const sc=lerp(1.8,1,E.oB(sp));const sw=640;ctx.save();ctx.translate(960,888);ctx.scale(sc,sc);ctx.globalAlpha=clamp(sp*4);
    rr(-sw/2,-32,sw,64,32);ctx.fillStyle=TEAL(0.14);ctx.fill();ctx.strokeStyle=C.teal;ctx.lineWidth=2;ctx.stroke();
    T('✓  CHAIN VERIFIED · 4/4 · SHA-256',0,9,{f:F(700,24,1),c:C.tealL,al:'center',ls:3});ctx.restore()}
  ctx.restore();ctx.restore();
  // RGB slice glitch during tamper
  if(tam&&t<TAM[0]+0.2){ctx.save();ctx.setTransform(1,0,0,1,0,0);for(let k=0;k<7;k++){const sd=Math.floor(t*60)*17+k*3;
    const y=hash(sd)*H,h=8+hash(sd+1)*80,dx=(hash(sd+2)-0.5)*110;ctx.drawImage(cv,0,y,W,h,dx,y,W,h)}
    ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(239,68,68,0.08)';ctx.fillRect(0,0,W,H);ctx.restore()}
}
function card(i,t,tam){
  const ts=cardT(i),dt=t-ts;if(dt<=0)return;const s=spring(dt,13,6.5);
  const x=CX0+i*CP;let jx=0,jy=0;if(tam){jx=(hash(Math.floor(t*60))-0.5)*22;jy=(hash(Math.floor(t*60)+9)-0.5)*8}
  const heal=t>TAM[1]&&i===2?Math.exp(-7*(t-TAM[1])):0;
  ctx.save();ctx.globalAlpha*=clamp(dt*7);
  ctx.translate(x+CW/2+(1-s)*640+jx,CY+CH/2+(1-s)*(i%2?110:-110)+jy);ctx.rotate((1-s)*0.22);const sc=lerp(0.65,1,s);ctx.scale(sc,sc);ctx.translate(-CW/2,-CH/2);
  ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=50;ctx.shadowOffsetY=20;rr(0,0,CW,CH,12);ctx.fillStyle=C.panel2;ctx.fill();ctx.shadowColor='transparent';
  ctx.strokeStyle=tam?C.red:heal>0.02?`rgba(94,234,212,${0.4+heal*0.6})`:C.line;ctx.lineWidth=tam||heal>0.02?2.5:1.5;ctx.stroke();
  if(heal>0.02){ctx.save();ctx.shadowColor=C.tealL;ctx.shadowBlur=40*heal;ctx.stroke();ctx.restore()}
  ctx.fillStyle=tam?C.red:C.teal;ctx.fillRect(0,14,4,CH-28);
  T(`EVENT #${String(i+1).padStart(3,'0')}`,26,46,{f:F(500,17,1),c:C.muted,ls:3});
  const nf=F(600,18,1),nw=M(EV[i][0],nf).width;rr(CW-26-nw-22,21,nw+22,34,7);ctx.fillStyle=tam?'rgba(239,68,68,0.15)':TEAL(0.14);ctx.fill();
  T(EV[i][0],CW-37,44,{f:nf,c:tam?C.red:C.tealL,al:'right'});
  T('HASH',26,104,{f:F(500,14,1),c:C.muted,ls:4});
  const lock=ts+0.28;let h=EV[i][1];
  if(tam)h=[...h].map((c,k)=>HEX[Math.floor(hash(k*7+Math.floor(t*50))*16)]).join('');
  else h=[...h].map((c,k)=>t>lock+k*0.018?c:HEX[Math.floor(hash(k*7+Math.floor(t*50)+i*99)*16)]).join('');
  T(g4(h),26,142,{f:F(500,27,1),c:tam?C.red:C.white});
  T('PREV',26,186,{f:F(500,14,1),c:C.muted,ls:4});
  T(g4(EV[i][2]),26,214,{f:F(400,19,1),c:'#6b7684'});
  if(!tam&&t>lock+0.35)T('✓',CW-26,214,{f:F(700,22,1),c:C.teal,al:'right',a:E.oC(P(t,lock+0.35,lock+0.5))});
  ctx.restore()}
function link(i,t,broken){
  const a=cardT(i+1)+0.22,p=E.oC(P(t,a,a+0.22));if(p<=0)return;
  const x0=CX0+i*CP+CW,x1=x0+CP-CW,y=CY+CH/2;ctx.save();
  ctx.strokeStyle=broken?C.red:C.teal;ctx.lineWidth=3;ctx.shadowColor=broken?C.red:C.teal;ctx.shadowBlur=14;
  if(broken){const j=(hash(Math.floor(t*60)+i)-0.5)*14;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+22,y+j);ctx.moveTo(x1-22,y-j);ctx.lineTo(x1,y);ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(lerp(x0,x1,p),y);ctx.stroke();
    if(p>=1){const n=E.oB(P(t,a+0.18,a+0.36));ctx.fillStyle=C.teal;ctx.beginPath();ctx.arc((x0+x1)/2,y,9*n,0,7);ctx.fill();
      const pr=P(t,a+0.2,a+0.7);if(pr>0&&pr<1){ctx.strokeStyle=TEAL(1-pr);ctx.lineWidth=2;ctx.beginPath();ctx.arc((x0+x1)/2,y,9+pr*40,0,7);ctx.stroke()}}}
  ctx.restore()}

/* ============ SCENE 3 — LIFECYCLE (4.5 → 7.0) ============ */
const ST=['Draft','PendingReview','Confirmed','Settling','Settled','Accounted','Matured','Terminated','Rejected','Cancelled','ClosedOut'];
const S3=4.74,STEP=0.17;
function scene3(t){
  bg();grid(0,-(t-4.5)*40,0.10*(1+beatPulse(t)*0.6));
  const cx=960,cy=606;
  const kr=(t-S3)/STEP,k=clamp(Math.floor(kr),0,10),fr=kr-Math.floor(kr);
  const kf=t<S3?0:Math.min(10,k+(k<10?E.ioC(clamp((fr-0.5)/0.5)):0));
